<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ระบบบริหารกระแสเงินสด — ประตูไม้</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1720; --panel:#16212e; --panel2:#1d2b3a; --line:#27384a;
    --text:#e8eef5; --muted:#90a4b8; --accent:#3b82f6;
    --green:#22c55e; --yellow:#eab308; --red:#ef4444;
    --font:'Sarabun','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  header h1{font-size:18px;margin:0;font-weight:700}
  header .sub{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  .ctrl{display:flex;align-items:center;gap:8px}
  input[type=date]{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:6px;font-family:var(--font)}
  .toggle{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .toggle button{background:none;border:none;color:var(--muted);padding:6px 14px;cursor:pointer;font-family:var(--font);font-size:14px}
  .toggle button.active{background:var(--accent);color:#fff;font-weight:600}
  nav{display:flex;gap:4px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex-wrap:wrap}
  nav button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:var(--font);font-size:14px;white-space:nowrap}
  nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  nav button.adv{border-style:dashed}
  main{padding:20px;max-width:1280px;margin:0 auto}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
  .card .big{font-size:26px;font-weight:700;margin:4px 0}
  .card .note{font-size:12px;color:var(--muted)}
  .badge{display:inline-block;width:10px;height:10px;border-radius:50%}
  .bdot-green{background:var(--green)} .bdot-yellow{background:var(--yellow)} .bdot-red{background:var(--red)}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
  .pill-green{background:rgba(34,197,94,.15);color:var(--green)}
  .pill-yellow{background:rgba(234,179,8,.15);color:var(--yellow)}
  .pill-red{background:rgba(239,68,68,.15);color:var(--red)}
  .tip{position:relative;cursor:help;color:var(--muted);border:1px solid var(--line);border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
  .tip:hover::after{content:attr(data-tip);position:absolute;left:0;top:22px;width:260px;background:#0a1119;border:1px solid var(--line);padding:10px;border-radius:8px;font-size:12px;color:var(--text);z-index:20;font-weight:400;line-height:1.5;white-space:normal}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:500}
  .section{margin-bottom:26px}
  .section h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .muted{color:var(--muted)}
  .chartbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;height:320px}
  .hidden{display:none}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>*{flex:1;min-width:280px}
  .alert{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px;margin-bottom:10px}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .form-grid input,.form-grid select{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px;border-radius:6px;font-family:var(--font)}
  button.primary{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-family:var(--font);font-weight:600}
  .loading{color:var(--muted);padding:40px;text-align:center}
  .scenario-leg{display:flex;gap:16px;font-size:13px;margin-bottom:8px}
  .scenario-leg span{display:flex;align-items:center;gap:6px}
  .swatch{width:14px;height:3px;border-radius:2px;display:inline-block}
</style>
</head>
<body>
<div id="loginScreen" style="position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center">
  <div style="background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:36px;width:340px;max-width:90%">
    <div style="text-align:center;font-size:34px">🚪</div>
    <h2 style="text-align:center;margin:6px 0 2px">ระบบบริหารกระแสเงินสด</h2>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px">เข้าสู่ระบบเพื่อใช้งาน</p>
    <div class="form-grid" style="grid-template-columns:1fr">
      <label>ชื่อผู้ใช้<input id="loginUser" type="text" value="admin" /></label>
      <label>รหัสผ่าน<input id="loginPass" type="password" value="" placeholder="admin" /></label>
    </div>
    <button class="primary" id="loginBtn" style="width:100%;margin-top:16px">เข้าสู่ระบบ</button>
    <div id="loginErr" style="color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:18px"></div>
  </div>
</div>
<header>
  <div>
    <h1>🚪 ระบบบริหารกระแสเงินสด</h1>
    <div class="sub">ธุรกิจรับจ้างผลิตประตูไม้ · THB</div>
  </div>
  <div class="spacer"></div>
  <div class="ctrl">
    <span class="muted" style="font-size:13px">ณ วันที่</span>
    <input type="date" id="asOf" />
  </div>
  <div class="toggle" id="modeToggle">
    <button data-mode="basic" class="active">พื้นฐาน</button>
    <button data-mode="advanced">ขั้นสูง</button>
  </div>
  <button id="logoutBtn" style="background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--font)">ออกจากระบบ</button>
</header>

<nav id="nav"></nav>
<main id="main"><div class="loading">กำลังโหลด…</div></main>

<script>
// ============================================================
// state & helpers
// ============================================================
const state = { mode:'basic', tab:'overview', asOf:new Date().toISOString().slice(0,10) };
const charts = {};
const baht = (s)=> (s==null?'-':'฿'+(Math.round(s)/100).toLocaleString('th-TH',{maximumFractionDigits:0}));
const pct = (v)=> (v==null?'-':v.toLocaleString('th-TH',{maximumFractionDigits:1})+'%');
const pill = (st)=> `<span class="pill pill-${st}">${st==='green'?'ปกติ':st==='yellow'?'เฝ้าระวัง':'เสี่ยง'}</span>`;
const dot = (st)=> `<span class="badge bdot-${st}"></span>`;
const tip = (t)=> `<span class="tip" data-tip="${t}">?</span>`;
async function api(path){
  const r = await fetch('/api'+path+(path.includes('?')?'&':'?')+'as_of='+state.asOf,{headers:{'Authorization':'Bearer '+(state.token||'')}});
  const j = await r.json();
  if(r.status===401){ logout(); throw new Error('หมดเวลาเข้าสู่ระบบ — กรุณาเข้าสู่ระบบใหม่'); }
  if(!j.ok) throw new Error(j.error);
  return j.data;
}

const TABS = [
  {id:'overview', label:'ภาพรวม', adv:false},
  {id:'cash', label:'เงินสด & สภาพคล่อง', adv:false},
  {id:'aging', label:'อายุหนี้ (AR/AP)', adv:false},
  {id:'cost', label:'ต้นทุน & ค่าสี', adv:false},
  {id:'production', label:'การผลิต', adv:false},
  {id:'inventory', label:'คลังสินค้า', adv:false},
  {id:'payroll', label:'เงินเดือน', adv:false},
  {id:'budget', label:'งบประมาณ', adv:false},
  {id:'forecast', label:'พยากรณ์เงินสด', adv:false},
  {id:'ccc', label:'วงจรเงินสด (CCC)', adv:true},
  {id:'jobs', label:'กำไรรายงาน', adv:true},
  {id:'abc', label:'ABC / ของตาย', adv:true},
  {id:'import', label:'นำเข้าข้อมูล', adv:false},
];

// ============================================================
// render shell
// ============================================================
function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.filter(t=> state.mode==='advanced' || !t.adv).map(t=>
    `<button data-tab="${t.id}" class="${t.id===state.tab?'active':''} ${t.adv?'adv':''}">${t.label}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(b=> b.onclick=()=>{ state.tab=b.dataset.tab; renderNav(); route(); });
}
function card(title, tipText, bigHtml, noteHtml, status){
  return `<div class="card">
    <h3>${status?dot(status):''}${title}${tipText?tip(tipText):''}</h3>
    <div class="big">${bigHtml}</div>
    <div class="note">${noteHtml||''}</div>
  </div>`;
}
function setMain(html){ document.getElementById('main').innerHTML = html; }
function mkChart(id, cfg){ if(charts[id]) charts[id].destroy(); const el=document.getElementById(id); if(el) charts[id]=new Chart(el, cfg); }

// ============================================================
// tabs
// ============================================================
async function route(){
  setMain('<div class="loading">กำลังโหลด…</div>');
  try{
    if(state.tab==='overview') return await tabOverview();
    if(state.tab==='cash') return await tabCash();
    if(state.tab==='aging') return await tabAging();
    if(state.tab==='cost') return await tabCost();
    if(state.tab==='production') return await tabProduction();
    if(state.tab==='inventory') return await tabInventory();
    if(state.tab==='payroll') return await tabPayroll();
    if(state.tab==='budget') return await tabBudget();
    if(state.tab==='forecast') return await tabForecast();
    if(state.tab==='ccc') return await tabCCC();
    if(state.tab==='jobs') return await tabJobs();
    if(state.tab==='abc') return await tabABC();
    if(state.tab==='import') return tabImport();
  }catch(e){ setMain(`<div class="alert">เกิดข้อผิดพลาด: ${e.message}<br><span class="muted">ตรวจว่าได้ตั้งค่า D1 และ seed ข้อมูลแล้ว (ดู README)</span></div>`); }
}

async function tabOverview(){
  const d = await api('/summary');
  const r = d.runway, l = d.liquidity, g = d.gross_margin, p = d.paint;
  const runwayTxt = r.runway_months==null ? 'กระแสบวก ✓' : r.runway_months+' เดือน';
  setMain(`
    <div class="section">
      <h2>สรุปที่เจ้าของถามบ่อย</h2>
      <div class="grid cards">
        ${card('เงินสดในมือ','เงินจริงๆ ที่มีอยู่ตอนนี้ รวมทุกบัญชี', baht(d.cash_on_hand_satang),'รวมทุกบัญชีธนาคาร/เงินสด', null)}
        ${card('เงินพอใช้อีก (Runway)','ถ้าใช้จ่ายแบบเดิม เงินสดจะอยู่ได้อีกกี่เดือนก่อนหมด = เงินในมือ ÷ เงินที่เผาต่อเดือน', runwayTxt, 'เผาเงินสุทธิ '+baht(r.net_burn_satang)+'/เดือน '+pill(r.status), r.status)}
        ${card('สภาพคล่อง (Current Ratio)','สินทรัพย์หมุนเวียน ÷ หนี้สินระยะสั้น — ของที่เปลี่ยนเป็นเงินได้ พอจ่ายหนี้สั้นไหม (≥1.5 ดี)', l.current_ratio, 'Quick ratio '+l.quick_ratio+' '+pill(l.current_status), l.current_status)}
        ${card('กำไรขั้นต้น','ขายได้ 100 บาท เหลือกี่บาทหลังหักต้นทุนทำของ', pct(g.gross_margin_pct), 'ยอดขาย '+baht(g.revenue_satang), g.gross_margin_pct>=30?'green':g.gross_margin_pct>=15?'yellow':'red')}
        ${card('ค่าใช้จ่าย/ยอดขาย','ทุกหมวดค่าใช้จ่ายรวมเป็นกี่ % ของยอดขาย', pct(d.expense_to_sales.expense_to_sales_pct), 'ดูรายหมวดในแท็บต้นทุน', d.expense_to_sales.expense_to_sales_pct<60?'green':d.expense_to_sales.expense_to_sales_pct<80?'yellow':'red')}
        ${card('ต้นทุนค่าสี','สัดส่วนค่าสีต่อยอดขาย + แนวโน้ม — โจทย์ที่เจ้าของห่วง', pct(p.paint_pct_of_revenue), 'ต่อบาน '+baht(p.paint_per_door_satang)+' · แนวโน้ม '+(p.trend_direction==='up'?'⬆ เพิ่มขึ้น':p.trend_direction==='down'?'⬇ ลดลง':'➡ คงที่')+' '+pill(p.status), p.status)}
      </div>
    </div>
    <div class="row">
      <div class="chartbox"><canvas id="ovPaint"></canvas></div>
      <div class="chartbox"><canvas id="ovExp"></canvas></div>
    </div>
  `);
  mkChart('ovPaint',{type:'line',data:{labels:p.trend.map(t=>t.month),datasets:[{label:'ค่าสีต่อเดือน (บาท)',data:p.trend.map(t=>t.paint_satang/100),borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,.1)',fill:true,tension:.3}]},options:chartOpts('แนวโน้มต้นทุนค่าสี')});
  const e = d.expense_to_sales.rows.slice(0,6);
  mkChart('ovExp',{type:'bar',data:{labels:e.map(x=>catTH(x.category)),datasets:[{label:'% ของยอดขาย',data:e.map(x=>x.pct_of_sales),backgroundColor:'#3b82f6'}]},options:chartOpts('ค่าใช้จ่ายต่อยอดขาย (รายหมวด)')});
}

async function tabCash(){
  const d = await api('/cash');
  const acc = d.on_hand.by_account, r = d.runway;
  setMain(`
    <div class="section"><h2>เงินสด & สภาพคล่อง</h2>
      <div class="grid cards">
        ${card('เงินสดรวม','รวมทุกบัญชี', baht(d.on_hand.total_satang),'', null)}
        ${card('รับเข้าเฉลี่ย/เดือน','เฉลี่ย 3 เดือนล่าสุด', baht(r.avg_inflow_satang),'', 'green')}
        ${card('จ่ายออกเฉลี่ย/เดือน','เฉลี่ย 3 เดือนล่าสุด', baht(r.avg_outflow_satang),'', 'yellow')}
        ${card('เผาเงินสุทธิ/เดือน','จ่ายออก − รับเข้า (บวก = เงินไหลออก)', baht(r.net_burn_satang), r.runway_months==null?'กระแสบวก':'Runway '+r.runway_months+' เดือน', r.status)}
      </div>
    </div>
    <div class="card"><h3>ยอดแยกรายบัญชี</h3>
      <table><thead><tr><th>บัญชี</th><th>ยอดคงเหลือ</th></tr></thead><tbody>
      ${Object.entries(acc).map(([k,v])=>`<tr><td>${k}</td><td>${baht(v)}</td></tr>`).join('')}
      </tbody></table>
    </div>
  `);
}

async function tabAging(){
  const d = await api('/aging');
  const ar=d.ar_aging, ap=d.ap_aging;
  const agingTable=(b,label)=>`
    <div class="card"><h3>${label}</h3>
    <table><thead><tr><th>ช่วงค้าง</th><th>ยอด</th></tr></thead><tbody>
      <tr><td>ยังไม่ครบกำหนด</td><td>${baht(b.not_due)}</td></tr>
      <tr><td>1–30 วัน</td><td>${baht(b.d1_30)}</td></tr>
      <tr><td>31–60 วัน</td><td>${baht(b.d31_60)}</td></tr>
      <tr><td>61–90 วัน</td><td>${baht(b.d61_90)}</td></tr>
      <tr><td style="color:var(--red)">เกิน 90 วัน ⚠</td><td style="color:var(--red)">${baht(b.d90_plus)}</td></tr>
      <tr><td><b>รวม</b></td><td><b>${baht(b.total)}</b></td></tr>
    </tbody></table></div>`;
  setMain(`
    <div class="section"><h2>อายุหนี้ ${tip('แยกหนี้ตามจำนวนวันที่ค้าง ยิ่งค้างนานยิ่งเสี่ยงเก็บไม่ได้')}</h2>
    <div class="row">${agingTable(ar,'ลูกหนี้การค้า (AR) — เงินที่ลูกค้าค้างเรา')}${agingTable(ap,'เจ้าหนี้การค้า (AP) — เงินที่เราค้างซัพ')}</div></div>
    <div class="row" style="margin-top:14px">
      <div class="chartbox"><canvas id="agAR"></canvas></div>
      <div class="chartbox"><canvas id="agAP"></canvas></div>
    </div>
  `);
  const labels=['ยังไม่ครบ','1-30','31-60','61-90','90+'];
  const vals=b=>[b.not_due,b.d1_30,b.d31_60,b.d61_90,b.d90_plus].map(v=>v/100);
  const cols=['#22c55e','#84cc16','#eab308','#f97316','#ef4444'];
  mkChart('agAR',{type:'doughnut',data:{labels,datasets:[{data:vals(ar),backgroundColor:cols}]},options:chartOpts('ลูกหนี้แยกช่วงอายุ')});
  mkChart('agAP',{type:'doughnut',data:{labels,datasets:[{data:vals(ap),backgroundColor:cols}]},options:chartOpts('เจ้าหนี้แยกช่วงอายุ')});
}

async function tabCost(){
  const d = await api('/cost');
  const cg=d.gross_margin, p=d.paint, c=d.cogs;
  setMain(`
    <div class="section"><h2>ต้นทุน & กำไร</h2>
      <div class="grid cards">
        ${card('ยอดขาย','', baht(cg.revenue_satang),'', null)}
        ${card('ต้นทุนขาย (COGS)','วัตถุดิบ+ค่าแรง+โสหุ้ย', baht(cg.cogs_satang),'', null)}
        ${card('กำไรขั้นต้น','', baht(cg.gross_profit_satang), pct(cg.gross_margin_pct), cg.gross_margin_pct>=30?'green':cg.gross_margin_pct>=15?'yellow':'red')}
      </div>
    </div>
    <div class="section"><h2>🎨 วิเคราะห์ต้นทุนค่าสี ${tip('โจทย์ที่เจ้าของห่วงว่า "เงินจมกับค่าสี"')}</h2>
      <div class="grid cards">
        ${card('ค่าสีต่อยอดขาย','ค่าสีคิดเป็นกี่ % ของยอดขาย', pct(p.paint_pct_of_revenue),'', p.status)}
        ${card('ค่าสีต่อต้นทุนขาย','ค่าสีคิดเป็นกี่ % ของต้นทุนทั้งหมด', pct(p.paint_pct_of_cogs),'', null)}
        ${card('ค่าสีต่อบาน','เฉลี่ยต่อบานประตู — จับงานที่ผิดปกติ', baht(p.paint_per_door_satang),'', null)}
        ${card('แนวโน้ม','ทิศทางค่าสีรายเดือน', p.trend_direction==='up'?'⬆ เพิ่มขึ้น':p.trend_direction==='down'?'⬇ ลดลง':'➡ คงที่','', p.status)}
      </div>
      <div class="chartbox" style="margin-top:14px"><canvas id="costPaint"></canvas></div>
    </div>
    <div class="section"><h2>ค่าใช้จ่ายต่อยอดขาย (รายหมวด)</h2>
      <div class="card"><table><thead><tr><th>หมวด</th><th>ยอด</th><th>% ยอดขาย</th></tr></thead><tbody>
      ${d.expense_to_sales.rows.map(x=>`<tr><td>${catTH(x.category)}</td><td>${baht(x.satang)}</td><td>${pct(x.pct_of_sales)}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
  `);

    bills:[['supplier_external_id','รหัสซัพ','text'],['issue_date','วันออกบิล','date'],['due_date','วันครบกำหนด','date'],['amount','จำนวนเงิน','number'],['category','หมวด','text']],
    expenses:[['category','หมวด','text'],['amount','จำนวนเงิน','number'],['spent_at','วันที่','date'],['note','หมายเหตุ','text']],
    budgets:[['period','เดือน(YYYY-MM)','text'],['category','หมวด','text'],['budget_type','รายรับ/รายจ่าย','bt'],['amount','จำนวนเงิน','number']],
  };
  function renderFields(){
    const ent=document.getElementById('impEntity').value;
    document.getElementById('impFields').innerHTML=fieldsByEntity[ent].map(([k,label,t])=>{
      if(t==='dir') return `<label>${label}<select data-k="${k}"><option value="in">เข้า</option><option value="out">ออก</option></select></label>`;
      if(t==='bt') return `<label>${label}<select data-k="${k}"><option value="expense">รายจ่าย</option><option value="revenue">รายรับ</option></select></label>`;
      return `<label>${label}<input data-k="${k}" type="${t}" /></label>`;
    }).join('');
  }
  renderFields();
  document.getElementById('impEntity').onchange=renderFields;
  document.getElementById('impSave').onclick=async()=>{
    const ent=document.getElementById('impEntity').value;
    const row={}; document.querySelectorAll('#impFields [data-k]').forEach(el=>row[el.dataset.k]=el.value);
    document.getElementById('impMsg').textContent='กำลังบันทึก…';
    try{ const r=await fetch('/api/manual/'+ent,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)}); const j=await r.json();
      document.getElementById('impMsg').textContent=j.ok?'✓ บันทึกแล้ว':'ผิดพลาด: '+j.error;
    }catch(e){ document.getElementById('impMsg').textContent='ผิดพลาด: '+e.message; }
  };
  document.getElementById('csvUpload').onclick=async()=>{
    const ent=document.getElementById('impEntity').value;
    const f=document.getElementById('csvFile').files[0];
    if(!f){ document.getElementById('csvMsg').textContent='เลือกไฟล์ก่อน'; return; }
    const text=await f.text();
    document.getElementById('csvMsg').textContent='กำลังอัปโหลด…';
    try{ const r=await fetch('/api/import/csv?entity='+ent+'&source=csv_'+Date.now(),{method:'POST',headers:{'Content-Type':'text/csv'},body:text}); const j=await r.json();
      document.getElementById('csvMsg').textContent=j.ok?`✓ เพิ่ม ${j.data.inserted} แก้ ${j.data.updated} ข้าม ${j.data.skipped}`:'ผิดพลาด: '+j.error;
    }catch(e){ document.getElementById('csvMsg').textContent='ผิดพลาด: '+e.message; }
  };
}

// ============================================================
// auth
// ============================================================
function showApp(){ document.getElementById('loginScreen').style.display='none'; renderNav(); route(); }
function logout(){ state.token=null; try{localStorage.removeItem('cf_token');}catch(e){} document.getElementById('loginScreen').style.display='flex'; }
async function doLogin(){
  const username=document.getElementById('loginUser').value;
  const password=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginErr'); errEl.textContent='กำลังเข้าสู่ระบบ…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const j=await r.json();
    if(!j.ok){ errEl.textContent=j.error||'เข้าสู่ระบบไม่สำเร็จ'; return; }
    state.token=j.data.token; try{localStorage.setItem('cf_token',state.token);}catch(e){}
    errEl.textContent=''; showApp();
  }catch(e){ errEl.textContent='ผิดพลาด: '+e.message; }
}
document.getElementById('loginBtn').onclick=doLogin;
document.getElementById('loginPass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('logoutBtn').onclick=logout;

document.getElementById('asOf').value = state.asOf;
document.getElementById('asOf').onchange = (e)=>{ state.asOf=e.target.value; route(); };
document.querySelectorAll('#modeToggle button').forEach(b=> b.onclick=()=>{
  state.mode=b.dataset.mode;
  document.querySelectorAll('#modeToggle button').forEach(x=>x.classList.toggle('active',x===b));
  if(TABS.find(t=>t.id===state.tab)?.adv && state.mode==='basic') state.tab='overview';
  renderNav(); route();
});
// ตรวจ token เดิม
try{ state.token=localStorage.getItem('cf_token'); }catch(e){}
if(state.token){ showApp(); } // ถ้า token หมดอายุ api() จะเด้งกลับ login เอง
