<style>
  :root{
    --bg:#f1f4ec;            /* เซจ-ครีมอ่อน (พาสเทล) */
    --bg-grad:
      radial-gradient(680px 420px at 10% 6%, rgba(120,170,135,.12), transparent 60%),
      radial-gradient(620px 420px at 93% 4%, rgba(198,166,112,.10), transparent 55%),
      radial-gradient(760px 540px at 80% 98%, rgba(120,170,135,.10), transparent 60%),
      linear-gradient(180deg,#f5f7f0 0%,#edf1e6 100%);
    --panel:#fffffe;         /* ขาวนวล */
    --panel2:#eef1e7;        /* เซจอ่อน (อินพุต) */
    --line:#e4e8da;          /* เส้นขอบเซจจาง */
    --text:#37433b;          /* เขียวอมเทาเข้ม นุ่มตา */
    --muted:#8c9384;         /* เซจเทา */
    --accent:#5a9d77;        /* เขียวเซจพาสเทล (สีหลัก) */
    --accent-d:#3f7d5c;      /* เขียวเข้มกว่า */
    --wood:#bb9170;          /* ไม้อ่อน/แทน */
    --wood-d:#8a6a4c;        /* ไม้เข้ม */
    --gold:#c9aa63;          /* ทองนวล */
    --green:#4aa478; --yellow:#dca03a; --red:#d4694c;   /* สถานะ พาสเทลแต่ชัด */
    --shadow:0 1px 2px rgba(70,80,60,.05), 0 10px 28px rgba(70,80,60,.07);
    --font:'Sarabun','Segoe UI',system-ui,sans-serif;
    --serif:'Playfair Display','Sarabun',serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--text);font-size:15px}
  #topbar{position:sticky;top:0;z-index:30}
  @media print{ #topbar{display:none!important} body{background:#fff} .section{break-inside:avoid} button{display:none!important} }
  header{background:linear-gradient(135deg,#5a9d77 0%,#74ad8d 55%,#83b89c 100%);border-bottom:3px solid var(--gold);padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 3px 16px rgba(90,157,119,.25);color:#ffffff}
  header h1{font-size:20px;margin:0;font-weight:700;color:#fff;letter-spacing:.3px;text-shadow:0 1px 2px rgba(40,70,50,.18)}
  header .sub{color:#eef7ef;font-size:12.5px;letter-spacing:.2px}
  header .muted{color:#e6f2e7 !important}
  .spacer{flex:1}
  .ctrl{display:flex;align-items:center;gap:8px}
  input[type=date]{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.5);color:#283129;padding:6px 8px;border-radius:8px;font-family:var(--font)}
  .toggle{display:flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.34);border-radius:9px;overflow:hidden}
  .toggle button{background:none;border:none;color:#e6efe6;padding:6px 14px;cursor:pointer;font-family:var(--font);font-size:14px}
  .toggle button.active{background:var(--gold);color:#2a2410;font-weight:700}
  nav{display:flex;gap:6px;padding:12px 20px;background:#fdfbf4;border-bottom:1px solid var(--line);box-shadow:0 4px 10px rgba(90,157,119,.08);overflow-x:auto;flex-wrap:wrap}
  nav button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 15px;border-radius:9px;cursor:pointer;font-family:var(--font);font-size:14px;white-space:nowrap;transition:all .15s}
  nav button:hover{border-color:var(--accent);color:var(--accent)}
  nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;box-shadow:0 2px 8px rgba(47,107,76,.3)}
  nav button.adv{border-style:dashed}
  main{padding:22px;max-width:1280px;margin:0 auto}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
  .card::after{content:'';position:absolute;left:0;top:0;height:100%;width:4px;background:linear-gradient(var(--accent),var(--gold))}
  .card-green::after{background:var(--green)}
  .card-yellow::after{background:var(--yellow)}
  .card-red::after{background:var(--red)}
  .card-green{background:linear-gradient(180deg,rgba(74,164,120,.06),var(--panel) 60%)}
  .card-yellow{background:linear-gradient(180deg,rgba(220,160,58,.07),var(--panel) 60%)}
  .card-red{background:linear-gradient(180deg,rgba(212,105,76,.07),var(--panel) 60%)}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(60,70,50,.1),0 16px 38px rgba(60,70,50,.08)}
  .card h3{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
  .card .big{font-size:27px;font-weight:700;margin:4px 0;font-family:var(--serif);color:var(--text);letter-spacing:.3px}
  .card .note{font-size:12px;color:var(--muted)}
  .badge{display:inline-block;width:10px;height:10px;border-radius:50%}
  .bdot-green{background:var(--green)} .bdot-yellow{background:var(--yellow)} .bdot-red{background:var(--red)}
  .pill{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
  .pill-green{background:rgba(47,143,91,.14);color:#256e46}
  .pill-yellow{background:rgba(189,139,0,.16);color:#8a6500}
  .pill-red{background:rgba(180,80,47,.14);color:#9a3f22}
  .tip{position:relative;cursor:help;color:var(--muted);border:1px solid var(--line);border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
  .tip:hover::after{content:attr(data-tip);position:absolute;left:0;top:22px;width:260px;background:#23492f;border:1px solid var(--gold);padding:11px;border-radius:10px;font-size:12px;color:#f1efe4;z-index:20;font-weight:400;line-height:1.55;white-space:normal;box-shadow:0 8px 24px rgba(30,45,30,.25)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--wood-d);font-weight:600;font-size:12px}
  tbody tr:hover{background:rgba(47,107,76,.045)}
  .section{margin-bottom:28px}
  .section h2{font-size:18px;margin:0 0 14px;padding-bottom:9px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent-d)}
  .section h2::before{content:'';width:4px;height:18px;background:linear-gradient(var(--accent),var(--gold));border-radius:3px;display:inline-block}
  .muted{color:var(--muted)}
  .chartbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;height:320px;box-shadow:var(--shadow)}
  .hidden{display:none}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>*{flex:1;min-width:280px}
  .alert{background:rgba(180,80,47,.08);border:1px solid rgba(180,80,47,.3);border-radius:12px;padding:13px;margin-bottom:10px;color:#7e3a20}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .form-grid input,.form-grid select{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:8px;font-family:var(--font)}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border:none;padding:10px 20px;border-radius:9px;cursor:pointer;font-family:var(--font);font-weight:600;box-shadow:0 3px 10px rgba(47,107,76,.25)}
  button.primary:hover{filter:brightness(1.07)}
  .loading{color:var(--muted);padding:40px;text-align:center}
  .scenario-leg{display:flex;gap:16px;font-size:13px;margin-bottom:8px}
  .scenario-leg span{display:flex;align-items:center;gap:6px}
  .swatch{width:14px;height:3px;border-radius:2px;display:inline-block}
  .hz-btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-family:var(--font);font-size:13px}
  .hz-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .stars{color:var(--gold);letter-spacing:3px}
  .scorebar{flex:1;background:var(--panel2);border-radius:10px;height:8px;overflow:hidden}
</style>
</head>
<body>
<div id="loginScreen" style="position:fixed;inset:0;background:var(--bg);background-image:var(--bg-grad);z-index:100;display:flex;align-items:center;justify-content:center">
  <div style="background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:36px;width:340px;max-width:90%">
    <div style="text-align:center"><img src="https://cdn.phototourl.com/free/2026-06-04-4bf268f0-68d4-4ac1-9558-6fe8362f128c.jpg" alt="WAYTHAI-FORYOU" onerror="this.style.display='none'" style="height:76px;width:76px;border-radius:18px;object-fit:cover;box-shadow:0 6px 18px rgba(47,107,76,.28)"></div>
    <h2 style="text-align:center;margin:12px 0 0;font-family:var(--serif);letter-spacing:.5px;color:var(--accent-d)">WAYTHAI-FORYOU</h2>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin:4px 0 20px">ระบบบริหารกระแสเงินสด — เข้าสู่ระบบ</p>
    <div class="form-grid" style="grid-template-columns:1fr">

  </div>
</div>
<div id="topbar">
<header>
  <img src="https://cdn.phototourl.com/free/2026-06-04-4bf268f0-68d4-4ac1-9558-6fe8362f128c.jpg" alt="WAYTHAI-FORYOU" onerror="this.style.display='none'" style="height:44px;width:44px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,.35);box-shadow:0 2px 8px rgba(0,0,0,.2)">
  <div>
    <h1 style="font-family:var(--serif);letter-spacing:.6px">WAYTHAI-FORYOU</h1>
    <div class="sub">ระบบบริหารกระแสเงินสด · รับจ้างผลิตประตูไม้ · THB</div>
  </div>
  <div class="spacer"></div>
  <div class="ctrl">
    <span class="muted" style="font-size:13px">ณ วันที่</span>
    <input type="date" id="asOf" />
  </div>
  <div class="ctrl" id="rangeCtrl" title="ใช้กับแท็บข้อมูล/ตาราง">
    <span class="muted" style="font-size:13px">ช่วง</span>

    <button data-mode="advanced">ขั้นสูง</button>

  <button id="installBtn" style="display:none;background:var(--gold);border:none;color:#2a2410;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--font);font-weight:600">⬇ ติดตั้งแอป</button>
  <button id="logoutBtn" style="background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.34);color:#eef5ee;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--font)">ออกจากระบบ</button>
</header>

<nav id="nav"></nav>
</div>
<main id="main"><div class="loading">กำลังโหลด…</div></main>

<script>
// ============================================================
// state & helpers
// ============================================================
const state = { mode:'basic', tab:'overview', asOf:new Date().toISOString().slice(0,10), from:null, to:null, dataEntity:'invoices', paintFilter:{}, paintFrom:null, paintTo:null };
const charts = {};
const baht = (s)=> (s==null?'-':'฿'+(Math.round(s)/100).toLocaleString('th-TH',{maximumFractionDigits:0}));
const pct = (v)=> (v==null?'-':v.toLocaleString('th-TH',{maximumFractionDigits:1})+'%');
const flowNote = (net)=> net<=0 ? `เงินเข้าสุทธิ +${baht(-net)}/เดือน` : `เผาเงินสุทธิ −${baht(net)}/เดือน`;
const bahtN = (x)=>'฿'+Math.round(x||0).toLocaleString('th-TH'); // บาทตรงๆ (ไม่ใช่สตางค์) สำหรับเครื่องคิดเลข BOM
const authHdr = ()=>({'Authorization':'Bearer '+(state.token||'')});
const ENTITIES = ['order','customers','suppliers','jobs','job_costs','invoices','bills','inventory_items','inventory_movements','expenses','cash_transactions','budgets','employees','payslips','material_purchases'];
const pill = (st)=> `<span class="pill pill-${st}">${st==='green'?'ปกติ':st==='yellow'?'เฝ้าระวัง':'เสี่ยง'}</span>`;
const dot = (st)=> `<span class="badge bdot-${st}"></span>`;
const tip = (t)=> `<span class="tip" data-tip="${t}">?</span>`;
async function api(path){
  const r = await fetch('/api'+path+(path.includes('?')?'&':'?')+'as_of='+state.asOf,{headers:{'Authorization':'Bearer '+(state.token||'')}});
  const j = await r.json();
  if(r.status===401){ logout(); throw new Error('หมดเวลาเข้าสู่ระบบ — กรุณาเข้าสู่ระบบใหม่'); }
  if(!j.ok) throw new Error(j.error);
  return j.data;
}

const TABS = [
  {id:'overview', label:'ภาพรวม', adv:false},
  {id:'advisor', label:'💡 คำแนะนำ', adv:false},
  {id:'cash', label:'เงินสด & สภาพคล่อง', adv:false},
  {id:'aging', label:'อายุหนี้ (AR/AP)', adv:false},
  {id:'cost', label:'ต้นทุน & ค่าสี', adv:false},
  {id:'pnl', label:'📊 งบกำไรขาดทุน', adv:false},
  {id:'bom', label:'BOM / ตั้งราคา', adv:false},
  {id:'production', label:'การผลิต', adv:false},
  {id:'payroll', label:'เงินเดือน', adv:false},
  {id:'data', label:'ข้อมูล (ตาราง)', adv:false},
  {id:'log', label:'ประวัติ/เวอร์ชัน', adv:false},
  {id:'ccc', label:'วงจรเงินสด (CCC)', adv:true},
  {id:'jobs', label:'กำไรรายงาน', adv:true},
  {id:'financials', label:'งบการเงิน', adv:true},
  {id:'import', label:'นำเข้าข้อมูล', adv:false},
];

// ============================================================
// render shell
// ============================================================
function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.filter(t=> state.mode==='advanced' || !t.adv).map(t=>
    `<button data-tab="${t.id}" class="${t.id===state.tab?'active':''} ${t.adv?'adv':''}">${t.label}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(b=> b.onclick=()=>{ state.tab=b.dataset.tab; renderNav(); route(); });
}
function card(title, tipText, bigHtml, noteHtml, status){
  const col = status==='green'?'var(--green)':status==='yellow'?'var(--yellow)':status==='red'?'var(--red)':'var(--text)';
  const icon = status==='green'?'✓ ':status==='yellow'?'▲ ':status==='red'?'▼ ':'';
  return `<div class="card card-${status||'neutral'}">
    <h3>${status?dot(status):''}${title}${tipText?tip(tipText):''}</h3>
    <div class="big" style="color:${col}">${status?`<span style="font-size:.7em;vertical-align:2px">${icon}</span>`:''}${bigHtml}</div>
    <div class="note">${noteHtml||''}</div>
  </div>`;
}
function setMain(html){ document.getElementById('main').innerHTML = html; }
function mkChart(id, cfg){ if(charts[id]) charts[id].destroy(); const el=document.getElementById(id); if(!el) return;
  if((cfg.type==='doughnut'||cfg.type==='pie') && cfg.options && cfg.options.scales) delete cfg.options.scales; // โดนัท/พาย ไม่ต้องมีแกน x/y
  charts[id]=new Chart(el, cfg); }

// ============================================================
// tabs
// ============================================================
async function route(){
  setMain('<div class="loading">กำลังโหลด…</div>');
  try{
    if(state.tab==='overview') return await tabOverview();
    if(state.tab==='advisor') return await tabAdvisor();
    if(state.tab==='cash') return await tabCash();
    if(state.tab==='aging') return await tabAging();
    if(state.tab==='cost') return await tabCost();
    if(state.tab==='pnl') return await tabPnL();
    if(state.tab==='paint') return await tabPaintAnalysis();
    if(state.tab==='bom') return tabBOM();
    if(state.tab==='production') return await tabProduction();
    if(state.tab==='inventory') return await tabInventory();
    if(state.tab==='inv_detail') return await tabInvDetail();
    if(state.tab==='inv_aging') return await tabInvAging();
    if(state.tab==='payroll') return await tabPayroll();
    if(state.tab==='data') return await tabData();
    if(state.tab==='log') return await tabLog();
    if(state.tab==='ccc') return await tabCCC();
    if(state.tab==='jobs') return await tabJobs();
    if(state.tab==='abc') return await tabABC();
    if(state.tab==='financials') return await tabFinancials();
    if(state.tab==='import') return tabImport();
  }catch(e){ setMain(`<div class="alert">เกิดข้อผิดพลาด: ${e.message}<br><span class="muted">ตรวจว่าได้ตั้งค่า D1 และ seed ข้อมูลแล้ว (ดู README)</span></div>`); }
}

// ── เกมพยากรณ์การเงินสิ้นปี (Gamification) ──────────────────
let GAME=null;
function runForecastGame(){
  const sl=document.getElementById('spendSlider'); if(!sl||!GAME) return;
  const mult=+sl.value/100;
  const inflEl=document.getElementById('inflSlider'); const infl=inflEl?(+inflEl.value/100):0;   // เงินเฟ้อ/ราคาวัตถุดิบขึ้น %
  const outEff=GAME.outflow*mult*(1+infl);                                                       // ต้นทุนต่อเดือนหลังปรับราคาขึ้น
  let bal=GAME.cash, depletion=null; const series=[];
  for(let i=0;i<GAME.monthsLeft;i++){ bal += GAME.inflow - outEff; series.push(Math.round(bal)); if(bal<0&&depletion===null) depletion=GAME.labels[i]; }
  const yearEnd=bal, monthlyExpense=outEff, buffer=Math.max(1,monthlyExpense*3);
  const inflValEl=document.getElementById('gameInflVal'); if(inflValEl) inflValEl.textContent=(infl*100).toFixed(0)+'%';
  let score=Math.round((yearEnd/buffer)*50+50); score=Math.max(0,Math.min(100,score)); if(depletion) score=Math.min(score,12);
  let emoji,color,verdict;
  if(depletion){ emoji='🔴'; color='var(--red)'; verdict=`สถานะ: วิกฤต — คาดว่ากระแสเงินสดจะติดลบในช่วง <b>${depletion}</b> ควรทบทวนค่าใช้จ่ายและเร่งจัดเก็บลูกหนี้โดยด่วน`; }
  else if(score>=65){ emoji='🟢'; color='var(--green)'; verdict=`สถานะ: แข็งแรง — คาดว่าสิ้นปีคงเหลือเงินสด <b>${baht(yearEnd)}</b> มีสภาพคล่องเพียงพอ`; }
  else if(score>=40){ emoji='🟡'; color='var(--yellow)'; verdict=`สถานะ: ต้องเฝ้าระวัง — คาดว่าสิ้นปีคงเหลือ <b>${baht(yearEnd)}</b> ควรควบคุมค่าใช้จ่ายอย่างใกล้ชิด`; }
  else { emoji='🟠'; color='#e0853a'; verdict=`สถานะ: เสี่ยง — คาดว่าสิ้นปีคงเหลือเพียง <b>${baht(yearEnd)}</b> ควรทบทวนงบประมาณและลดค่าใช้จ่าย`; }
  const over=Math.round((mult-1)*100);

let FCHORIZON=12;
function stars(s){const f=Math.round(s);return '★'.repeat(Math.max(0,Math.min(5,f)))+'☆'.repeat(Math.max(0,5-f));}
function financialScore(o){
  const cl=v=>Math.max(0,Math.min(1,v));
  const ccc=(o.dso||0)-(o.dpo||0);           // วงจรเงินสด (AR−AP) — ไม่รวมสต็อก (ไม่เน้นสต็อก)
  const parts=[
    {k:'กำไรขั้นต้น (Gross Margin)', s:cl(o.gm/30), val:o.gm.toFixed(1)+'%'},
    {k:'วงจรเงินสด (CCC = DSO−DPO)', s:cl((60-ccc)/90), val:ccc.toFixed(0)+' วัน'},
    {k:'เงินสำรอง (Runway)', s:o.runway==null?1:cl(o.runway/12), val:o.runway==null?'กระแสบวก':o.runway+' ด.'},
    {k:'ระยะเก็บหนี้ (DSO)', s:cl((90-o.dso)/60), val:o.dso.toFixed(0)+' วัน'},
    {k:'ระยะจ่ายหนี้ (DPO)', s:cl(o.dpo/45), val:(o.dpo||0).toFixed(0)+' วัน'},
  ];
  const avg=parts.reduce((a,b)=>a+b.s,0)/parts.length, score5=Math.round(avg*50)/10;
  return {score5, parts, status:score5>=3.75?'green':score5>=2.5?'yellow':'red'};
}
function scenarioCardsHTML(lr){
  const end=o=>o.series.length?baht(o.series[o.series.length-1].balance_satang):'-';
  const sc=(label,desc,o,goodColor)=>card(label,desc,o.depletion_month?('เงินหมด '+o.depletion_month):'อยู่รอด', o.depletion_month?('คาดติดลบ '+o.depletion_month):('คงเหลือปลายงวด '+end(o)), o.depletion_month?'red':goodColor);
  return sc('กรณีฐาน (Base case)','สมมติฐานปัจจุบัน',lr.base,'green')
       + sc('กรณีดีที่สุด (Best case)','เก็บเงินเร็วขึ้น 10% / ลดต้นทุน 10%',lr.optimistic,'green')
       + sc('กรณีแย่ที่สุด (Worst case)','เก็บเงินช้าลง / ต้นทุนเพิ่ม 15%',lr.pessimistic,'yellow');
}

  FCHORIZON=months;

  const fc=await api('/forecast?months='+months); const lr=fc.long_range;

    {label:'Best case',data:lr.optimistic.series.map(x=>x.balance_satang/100),borderColor:'#4aa478',tension:.2},

}

// ── งบกำไรขาดทุน (P&L) — เลือก 2 งวด (multi-เดือน) + vertical/horizontal + พิมพ์/CSV ──
const PNL_CATLBL={paint:'ค่าสี',wood:'ค่าไม้',hardware:'ฮาร์ดแวร์/วัตถุดิบ',labor:'ค่าแรงผลิต',salary:'เงินเดือน',salary_admin:'เงินเดือน (Admin)',rent:'ค่าเช่า',utility:'ค่าน้ำ-ไฟ',marketing:'การตลาด',ads:'โฆษณา (Ads)',transport:'ค่าขนส่ง',overhead:'โสหุ้ย',other:'อื่นๆ'};
const PNL_COGS=['paint','wood','hardware','labor','salary'];
const PNL_OH=['salary_oh','rent','utility','marketing','ads','transport','overhead','other'];
function pnlRangeAgg(monthly,from,to){
  const r={revenue:0,dm:0,dl:0,moh:0,opex:{}};
  for(const m of monthly){ if(m.month>=from&&m.month<=to){
    r.revenue+=m.revenue;
    r.dm+=(m.cogs&&m.cogs.direct_material)||0; r.dl+=(m.cogs&&m.cogs.direct_labor)||0; r.moh+=(m.cogs&&m.cogs.overhead)||0;
    for(const k in (m.opex||{})) r.opex[k]=(r.opex[k]||0)+m.opex[k];
  } }
  r.cogs=r.dm+r.dl+r.moh;
  r.oh=Object.values(r.opex).reduce((s,v)=>s+v,0);
  r.gross=r.revenue-r.cogs; r.net=r.gross-r.oh;
  return r;
}

function runPnL(){
  const monthly=window.__pnl||[];
  const gv=id=>{const e=document.getElementById(id);return e?e.value:'';};
  let a0=gv('plAfrom'),a1=gv('plAto'); if(a0>a1){const t=a0;a0=a1;a1=t;}
  let b0=gv('plBfrom'),b1=gv('plBto'); if(b0>b1){const t=b0;b0=b1;b1=t;}
  const A=pnlRangeAgg(monthly,a0,a1), B=pnlRangeAgg(monthly,b0,b1);
  window.__pnlAB={A,B,labA:a0+'…'+a1,labB:b0+'…'+b1};
  const vp=(val,rev)=>rev?(val/rev*100):0;
  const hp=(a,b)=>a?((b-a)/Math.abs(a)*100):(b?100:0);
  const row=(label,aVal,bVal,opt={})=>{
    const indent=opt.sub?'padding-left:24px':''; const bold=opt.bold?'font-weight:700':''; const bg=opt.head?'background:rgba(154,106,67,.08)':'';

        ${row('โสหุ้ยการผลิต (Overhead)',A.moh,B.moh,{sub:true,cost:true})}
        ${row('กำไรขั้นต้น (Gross Profit)',A.gross,B.gross,{bold:true})}
        ${row('ค่าใช้จ่ายดำเนินงาน (Operating Exp.)',A.oh,B.oh,{head:true,bold:true,cost:true})}
        ${opexKeys.map(opexRow).join('')}
        ${row('กำไรสุทธิ (Net Profit)',A.net,B.net,{bold:true})}

function exportPnLCSV(){
  const ab=window.__pnlAB; if(!ab) return; const {A,B,labA,labB}=ab;
  const v=(val,rev)=>rev?(val/rev*100).toFixed(1):'0'; const h=(a,b)=>a?(((b-a)/Math.abs(a))*100).toFixed(1):'0'; const b2=s=>(s/100).toFixed(2);
  const rows=[['รายการ','งวดA('+labA+')','%ขายA','งวดB('+labB+')','%ขายB','เปลี่ยนแปลง%']];
  const push=(label,a,b)=>rows.push([label,b2(a),v(a,A.revenue),b2(b),v(b,B.revenue),h(a,b)]);
  push('รายได้รวม',A.revenue,B.revenue); push('ต้นทุนขาย (COGS)',A.cogs,B.cogs);
  push('  วัตถุดิบทางตรง (Direct Material)',A.dm,B.dm); push('  ค่าแรงทางตรง (Direct Labor)',A.dl,B.dl); push('  โสหุ้ยการผลิต (Overhead)',A.moh,B.moh);
  push('กำไรขั้นต้น',A.gross,B.gross); push('ค่าใช้จ่ายดำเนินงาน',A.oh,B.oh);
  [...new Set([...Object.keys(A.opex),...Object.keys(B.opex)])].forEach(k=>push('  '+(PNL_CATLBL[k]||k),A.opex[k]||0,B.opex[k]||0));
  push('กำไรสุทธิ',A.net,B.net);
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='income_statement.csv'; a.click(); URL.revokeObjectURL(url);
}

function setPaintFilter(dim,val){ state.paintFilter=state.paintFilter||{}; if(val) state.paintFilter[dim]=val; else delete state.paintFilter[dim]; tabPaintAnalysis(); }
function clearPaintFilter(){ state.paintFilter={}; tabPaintAnalysis(); }
function setPaintDate(from,to){ state.paintFrom=from; state.paintTo=to; tabPaintAnalysis(); }
function setPaintCmpMetric(m){
  window.__cmpMetric=m;
  const bp=document.getElementById('cmpMpaint'), ba=document.getElementById('cmpMall');
  if(bp){ bp.style.background=m==='paint'?'var(--green)':''; bp.style.color=m==='paint'?'#fff':''; bp.style.borderColor=m==='paint'?'var(--green)':''; }
  if(ba){ ba.style.background=m==='all'?'var(--green)':''; ba.style.color=m==='all'?'#fff':''; ba.style.borderColor=m==='all'?'var(--green)':''; }
  runPaintCompare();
}
function runPaintCompare(){
  const data=window.__pmonthly||[];
  const metric=window.__cmpMetric||'paint';                    // 'paint' = ค่าสี | 'all' = ยอดซื้อรวม
  const val=z=> metric==='all' ? (z.paint+(z.other||0)) : z.paint;
  const mLabel=metric==='all'?'ยอดซื้อรวม':'ค่าสี';
  const gv=id=>{const e=document.getElementById(id);return e?e.value:'';};
  let a0=gv('cmpAfrom'),a1=gv('cmpAto'); if(a0>a1){const t=a0;a0=a1;a1=t;}
  let b0=gv('cmpBfrom'),b1=gv('cmpBto'); if(b0>b1){const t=b0;b0=b1;b1=t;}
  const inR=(m,x,y)=>m>=x&&m<=y;
  const la=data.filter(z=>inR(z.month,a0,a1)), lb=data.filter(z=>inR(z.month,b0,b1));
  const sa=la.reduce((s,z)=>s+val(z),0)/100, sb=lb.reduce((s,z)=>s+val(z),0)/100;
  const aa=la.length?sa/la.length:0, ab=lb.length?sb/lb.length:0;
  const diff=sa?(sb-sa)/sa*100:0;
  const labA=a0===a1?a0:a0+' … '+a1, labB=b0===b1?b0:b0+' … '+b1;
  const dcol=diff>0?'var(--red)':'var(--green)', darr=diff>0?'▲':(diff<0?'▼':'—');
  const sum=document.getElementById('cmpSummary');
  if(sum) sum.innerHTML=`<div class="grid cards">
    <div class="card"><h3 style="color:#d4694c">● กลุ่ม A · ${labA}</h3><div class="big" style="font-size:22px">${bahtN(sa)}</div><div class="muted">${mLabel} · ${la.length} เดือน · เฉลี่ย ${bahtN(aa)}/เดือน</div></div>
    <div class="card"><h3 style="color:#5a9d77">● กลุ่ม B · ${labB}</h3><div class="big" style="font-size:22px">${bahtN(sb)}</div><div class="muted">${mLabel} · ${lb.length} เดือน · เฉลี่ย ${bahtN(ab)}/เดือน</div></div>
    <div class="card"><h3>ผลต่าง (B เทียบ A)</h3><div class="big" style="font-size:22px;color:${dcol}">${darr} ${diff>0?'+':''}${diff.toFixed(1)}%</div><div class="muted">${bahtN(sb-sa)} ${diff>0?'· '+mLabel+'เพิ่มขึ้น':(diff<0?'· '+mLabel+'ลดลง':'')}</div></div>
  </div>`;
  const maxLen=Math.max(la.length,lb.length,1);
  const labels=Array.from({length:maxLen},(_,i)=>'เดือนที่ '+(i+1));
  mkChart('paintCompare',{type:'bar',data:{labels,datasets:[
    {label:'A: '+labA,data:Array.from({length:maxLen},(_,i)=>la[i]?Math.round(val(la[i])/100):null),backgroundColor:'#d4694c'},
    {label:'B: '+labB,data:Array.from({length:maxLen},(_,i)=>lb[i]?Math.round(val(lb[i])/100):null),backgroundColor:'#5a9d77'}
  ]},options:chartOpts('เทียบ'+mLabel+'รายเดือน A vs B (เรียงตามลำดับเดือนในช่วงที่เลือก)')});
}

// ── เฟส 4: BOM / เครื่องคำนวณราคาขาย (client-side) ──────────
function bomOut(label,id,color){return `<div class="card" style="padding:12px"><h3 style="margin-bottom:2px">${label}</h3><div class="big" style="font-size:20px;${color?'color:var(--'+color+')':''}" id="${id}">—</div></div>`;}
function runBOM(){
  const g=id=>parseFloat(document.getElementById(id).value)||0;
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
  const qty=Math.max(1,g('bomQty'));
  const wood=g('bomWood'), paint=g('bomPaint'), hw=g('bomHw'), labor=g('bomLabor'), other=g('bomOther');
  const directCost=wood+paint+hw+labor;
  const overhead=Math.round(directCost*g('bomOhPct')/100);
  const totalCost=directCost+overhead+other;
  let margin=g('bomMargin'); if(margin>=95) margin=95; if(margin<0) margin=0;
  const price=margin>0?Math.round(totalCost/(1-margin/100)):totalCost;
  const profit=price-totalCost;
  const markup=totalCost>0?(profit/totalCost*100):0;
  const vat=document.getElementById('bomVat').checked;
  set('bomOutCost', bahtN(totalCost));
  set('bomOutCostUnit', bahtN(totalCost/qty));
  set('bomOutOh', bahtN(overhead));
  set('bomOutPrice', bahtN(price));
  set('bomOutPriceUnit', bahtN(price/qty));
  set('bomOutProfit', bahtN(profit));
  set('bomOutMarkup', markup.toFixed(1)+'%');
  set('bomOutVat', vat?bahtN(Math.round(price*1.07)):'ไม่คิด');
  const paintPct=totalCost>0?(paint/totalCost*100):0;
  const warn=document.getElementById('bomPaintWarn');
  if(warn) warn.innerHTML = paintPct>25?`<span style="color:var(--red)">⚠ ค่าสีคิดเป็น ${paintPct.toFixed(0)}% ของต้นทุน — สูงผิดปกติ ควรตรวจสอบ/ต่อรองซัพ</span>`:`ค่าสีคิดเป็น ${paintPct.toFixed(0)}% ของต้นทุนงานนี้`;
  // ถ้าตั้งราคาโดยลืมโสหุ้ย+ค่าใช้จ่ายอื่น จะตั้งต่ำไปเท่าไร
  const naivePrice=margin>0?Math.round(directCost/(1-margin/100)):directCost;
  const miss=price-naivePrice; const missEl=document.getElementById('bomMiss');
  if(missEl) missEl.innerHTML = miss>0?`💡 ถ้าตั้งราคาโดยคิดแต่ต้นทุนทางตรง (ลืมโสหุ้ย/ค่าใช้จ่ายอื่น ${bahtN(overhead+other)}) จะตั้งราคาต่ำไป <b>${bahtN(miss)}</b> ต่องาน — กำไรหายทันที`:'';
  mkChart('bomChart',{type:'doughnut',data:{labels:['ไม้','สี','ฮาร์ดแวร์','ค่าแรง','โสหุ้ย','อื่นๆ'],datasets:[{data:[wood,paint,hw,labor,overhead,other],backgroundColor:['#9a6a43','#d4694c','#c9aa63','#5a9d77','#7cb295','#b0a48f']}]},options:chartOpts('โครงสร้างต้นทุนงานนี้')});
}

// อ่านวันที่ให้เป็น YYYY-MM-DD เสมอ — รองรับ Date object (กัน timezone เพี้ยน), dd/mm/yyyy, yyyy-mm-dd, และเผื่อ พ.ศ→ค.ศ
const DATE_KEYS=['issue_date','due_date','spent_at','txn_date','purchase_date','start_date','paid_date','moved_at','incurred_at','completed_at','delivered_date','promised_date','last_counted_at'];
function toISO(v){
  if(v==null||v==='') return v;
  if(v instanceof Date) return v.getUTCFullYear()+'-'+String(v.getUTCMonth()+1).padStart(2,'0')+'-'+String(v.getUTCDate()).padStart(2,'0');
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);   // dd/mm/yyyy
  if(m){ let y=+m[3]; if(y>2200) y-=543; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
  m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);        // yyyy-mm-dd
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  return s;
}
async function importExcel(file){
  const msg=document.getElementById('xlsxMsg'); msg.textContent='กำลังอ่านไฟล์…';
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const source='excel_'+(file.name||'upload').replace(/[^a-zA-Z0-9_.-]/g,'_'); // source ตามชื่อไฟล์ → อัปไฟล์เดิมซ้ำ = upsert ไม่เบิ้ล
    const SHEET_ALIAS={'COGS&Expense':'expenses','COGS & Expense':'expenses'};   // ชีตชื่อใหม่ map กลับ entity เดิม
    // ── กันซ้ำ: เตือนถ้าเคยอัปโหลดกลุ่มข้อมูลเดียวกันด้วย "ชื่อไฟล์อื่น" (source ต่าง = ระบบนับเป็นคนละชุด → เบิ้ล) ──
    try{
      const sheetsHere=[...new Set(wb.SheetNames.map(sn=>SHEET_ALIAS[sn]||sn))].filter(e=>ENTITIES.includes(e));
      const batches=await api('/import/batches');
      const ENT_TH={order:'ออเดอร์',expenses:'รายจ่าย',cash_transactions:'เงินสด',employees:'พนักงาน',material_purchases:'ค่าสี/วัตถุดิบ'};
      const conflicts=[...new Set((batches||[]).filter(b=>sheetsHere.includes(b.entity)&&b.source!==source).map(b=>b.entity))];
      if(conflicts.length){
        const names=conflicts.map(e=>ENT_TH[e]||e).join(', ');
        const go=confirm('⚠ เคยอัปโหลดข้อมูลกลุ่มนี้ ('+names+') จาก "ไฟล์ชื่ออื่น" มาก่อน\n\nถ้าอัปไฟล์ชื่อใหม่ ระบบจะนับเป็นคนละชุด → ข้อมูลอาจซ้ำ (เบิ้ล)\n\n✅ แนะนำ: ใช้ "ชื่อไฟล์เดิม" ระบบจะทับของเก่าให้ ไม่เบิ้ล\n\nกด OK เพื่อนำเข้าต่อ (รับความเสี่ยงซ้ำ) / Cancel เพื่อยกเลิก');
        if(!go){ msg.innerHTML='ยกเลิกการนำเข้า — เปลี่ยนกลับเป็น <b>ชื่อไฟล์เดิม</b> แล้วอัปใหม่ (ระบบจะทับ ไม่เบิ้ล)<br>หรือถ้าต้องการล้างของซ้ำก่อน ดูไฟล์ clear_imported.sql / clear_material_dupes.sql'; return; }
      }
    }catch(e){}
    const total={inserted:0,updated:0,skipped:0,sheets:0,errors:[]};
    for(const sn of wb.SheetNames){            // ลำดับชีตในไฟล์ = ลำดับ dependency ที่ถูกต้องอยู่แล้ว
      const ent=SHEET_ALIAS[sn]||sn;
      if(!ENTITIES.includes(ent)) continue;
      const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,blankrows:false,defval:null});
      if(aoa.length<3) continue;               // แถว1=ไทย, แถว2=field, แถว3+=ข้อมูล
      const keys=aoa[1];
      const rows=aoa.slice(2).map(arr=>{const o={};keys.forEach((k,i)=>{if(k!=null&&String(k).trim()!==''){let v=arr[i]; const kk=String(k).trim(); if(v instanceof Date||DATE_KEYS.includes(kk)) v=toISO(v); o[kk]=v;}});return o;})
        .filter(o=>o.external_id!=null&&String(o.external_id).trim()!=='');
      if(!rows.length) continue;
      total.sheets++;
      const CHUNK=400;                                  // ทยอยส่งทีละ 400 แถว กัน Worker timeout
      for(let off=0; off<rows.length; off+=CHUNK){
        const part=rows.slice(off,off+CHUNK);
        msg.textContent=`กำลังนำเข้า ${sn} (${Math.min(off+CHUNK,rows.length)}/${rows.length} แถว)…`;
        const r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json',...authHdr()},body:JSON.stringify({source,entity:ent,rows:part})});
        const j=await r.json();
        if(j.ok){ total.inserted+=j.data.inserted; total.updated+=j.data.updated; total.skipped+=j.data.skipped; if(j.data.errors&&j.data.errors.length) total.errors.push(...j.data.errors.map(e=>sn+': '+e.error)); }
        else total.errors.push(sn+': '+j.error);
      }
    }
    msg.innerHTML=`✓ นำเข้าเสร็จ — ${total.sheets} ชีต · เพิ่ม ${total.inserted} · แก้ ${total.updated} · ข้าม ${total.skipped}`+(total.errors.length?`<br><span style="color:var(--red)">ปัญหา ${total.errors.length} รายการ: ${total.errors.slice(0,3).join('; ')}</span>`:'<br>ดูประวัติได้ที่แท็บ "ประวัติ/เวอร์ชัน"');
  }catch(e){ msg.textContent='ผิดพลาด: '+e.message; }
}

function showApp(){ document.getElementById('loginScreen').style.display='none'; renderNav(); route(); }
function logout(){ state.token=null; try{localStorage.removeItem('cf_token');}catch(e){} document.getElementById('loginScreen').style.display='flex'; }
async function doLogin(){
  const username=document.getElementById('loginUser').value;
  const password=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginErr'); errEl.textContent='กำลังเข้าสู่ระบบ…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const j=await r.json();
    if(!j.ok){ errEl.textContent=j.error||'เข้าสู่ระบบไม่สำเร็จ'; return; }
    state.token=j.data.token; try{localStorage.setItem('cf_token',state.token);}catch(e){}
    errEl.textContent=''; showApp();
  }catch(e){ errEl.textContent='ผิดพลาด: '+e.message; }
}

document.getElementById('loginPass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
